[package]
name = "happypodctl"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Command line interface for Happy Pod: ship, scale, watch and fix apps, GPU pods and databases"
license = "MIT"
repository = "https://github.com/happy-pod/happypodctl"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# 0.12 with rustls on ring, the same TLS stack as the happy-pod API crate.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1.6", features = ["v4"] }
rpassword = "7.3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
